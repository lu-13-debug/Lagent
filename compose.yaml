services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      PUBLIC_URL: https://${LAGENT_DOMAIN:?请先在.env中填写LAGENT_DOMAIN}
      LAGENT_DATA_DIR: /app/data
      LAGENT_CREDENTIAL_MASTER_KEY: ${LAGENT_CREDENTIAL_MASTER_KEY-}
      LAGENT_MODEL_HOSTS: ${LAGENT_MODEL_HOSTS-api.deepseek.com,api.anthropic.com,api.openai.com}
      TRUST_PROXY: 1
    expose:
      - "3002"
    volumes:
      - accounts_data:/app/data
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAGENT_DOMAIN: ${LAGENT_DOMAIN:?请先在.env中填写LAGENT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  accounts_data:
  caddy_data:
  caddy_config:

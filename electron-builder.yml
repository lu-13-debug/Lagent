appId: com.lagent.desktop
productName: Lagent
copyright: Copyright © 2026 Lagent
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - server/**/*.js
  - '!server/**/*.test.js'
  - desktop/**/*
  - '!desktop/**/*.test.cjs'
  - build/icon.png
  - build/cloud-config.json
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lagent-Setup-${version}-${arch}.${ext}
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lagent
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  runAfterFinish: true
  deleteAppDataOnUninstall: false

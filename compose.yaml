services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      PUBLIC_URL: https://${LAGENT_DOMAIN:?请先在.env中填写LAGENT_DOMAIN}
      LAGENT_DATA_DIR: /app/data
      LAGENT_CREDENTIAL_MASTER_KEY: ${LAGENT_CREDENTIAL_MASTER_KEY-}
      LAGENT_MODEL_HOSTS: ${LAGENT_MODEL_HOSTS-api.deepseek.com,api.anthropic.com,api.openai.com}
      LAGENT_WORK_ENABLED: ${LAGENT_WORK_ENABLED-1}
      LAGENT_ALLOW_EXTERNAL_EXECUTORS: ${LAGENT_ALLOW_EXTERNAL_EXECUTORS-0}
      LAGENT_REGISTRATION: ${LAGENT_REGISTRATION-open}
      # 指挥台的可调开关；不转发时模板里的值在容器内不会生效。
      LAGENT_WORK_OUTBOX: ${LAGENT_WORK_OUTBOX-0}
      LAGENT_WORK_ROUTINES: ${LAGENT_WORK_ROUTINES-1}
      LAGENT_MCP_CLIENT: ${LAGENT_MCP_CLIENT-1}
      LAGENT_MCP_PROJECT_CONFIG: ${LAGENT_MCP_PROJECT_CONFIG-0}
      LAGENT_LIVE_VIEW: ${LAGENT_LIVE_VIEW-1}
      LAGENT_LIVE_INTERVAL_MS: ${LAGENT_LIVE_INTERVAL_MS-1000}
      LAGENT_CLI_TIMEOUT_MS: ${LAGENT_CLI_TIMEOUT_MS-3600000}
      LAGENT_AUTO_VERIFY: ${LAGENT_AUTO_VERIFY-1}
      # 手机号验证与短信供应商：默认关闭/未配置，不影响旧部署。
      LAGENT_REQUIRE_PHONE: ${LAGENT_REQUIRE_PHONE-0}
      LAGENT_PHONE_SECRET: ${LAGENT_PHONE_SECRET-}
      LAGENT_SMS_PROVIDER: ${LAGENT_SMS_PROVIDER-none}
      LAGENT_SMS_ALLOW_MOCK: ${LAGENT_SMS_ALLOW_MOCK-0}
      LAGENT_SMS_HTTP_URL: ${LAGENT_SMS_HTTP_URL-}
      LAGENT_SMS_HTTP_TOKEN: ${LAGENT_SMS_HTTP_TOKEN-}
      LAGENT_SMS_SIGN_NAME: ${LAGENT_SMS_SIGN_NAME-}
      LAGENT_SMS_TEMPLATE_ID: ${LAGENT_SMS_TEMPLATE_ID-}
      LAGENT_SMS_ACCESS_KEY_ID: ${LAGENT_SMS_ACCESS_KEY_ID-}
      LAGENT_SMS_ACCESS_KEY_SECRET: ${LAGENT_SMS_ACCESS_KEY_SECRET-}
      LAGENT_SMS_REGION: ${LAGENT_SMS_REGION-cn-hangzhou}
      LAGENT_SMS_DAILY_BUDGET: ${LAGENT_SMS_DAILY_BUDGET-500}
      # 定时加密备份；启用时务必配置口令，否则不会启动。
      LAGENT_BACKUP_INTERVAL_HOURS: ${LAGENT_BACKUP_INTERVAL_HOURS-0}
      LAGENT_BACKUP_DIR: ${LAGENT_BACKUP_DIR-/app/data/backups}
      LAGENT_BACKUP_PASSPHRASE: ${LAGENT_BACKUP_PASSPHRASE-}
      LAGENT_BACKUP_KEEP: ${LAGENT_BACKUP_KEEP-14}
      TRUST_PROXY: 1
    expose:
      - "3002"
    volumes:
      - accounts_data:/app/data
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAGENT_DOMAIN: ${LAGENT_DOMAIN:?请先在.env中填写LAGENT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  accounts_data:
  caddy_data:
  caddy_config:

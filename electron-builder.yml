appId: com.lagent.desktop
productName: Lagent
copyright: Copyright © 2026 Lagent
asar: true
npmRebuild: false
directories:
  # 安装包统一输出到上层 D:\lagent\release（与解包版归档同级）
  output: ../release
  buildResources: build
files:
  - dist/**/*
  - server/**/*.js
  - server/**/*.json
  - server/tools/**/*
  - '!server/**/*.test.js'
  - desktop/**/*
  - '!desktop/**/*.test.cjs'
  - scripts/window-bridge.ps1
  - build/icon.png
  - build/cloud-config.json
  - package.json
# 子进程要直接执行这些文件，放在 asar 里会因路径不可执行而失败。
asarUnpack:
  - scripts/window-bridge.ps1
  - server/tools/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lagent-Setup-${version}-${arch}.${ext}
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lagent
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  runAfterFinish: true
  deleteAppDataOnUninstall: false
